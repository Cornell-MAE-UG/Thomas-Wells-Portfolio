# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.


# Site Settings
locale                   : "en-US"
title                    : Thomas Wells
title_separator          : "-"
subtitle                 : "Mechanical design, rapid prototyping, and high-precision mechatronics." # tagline shown in the homepage hero
name                     : Thomas Wells
description              : Thomas Wells - Projects and CV
baseurl                  : "/Thomas-Wells-Portfolio" # Set this to your repo name (keep the leading slash)
# Optional footer links — uncomment and fill in to show them
# email                  : you@example.com
# linkedin               : https://www.linkedin.com/in/your-profile

# Theme and Style
theme: jekyll-theme-minimal

sass:
  style: compressed

# Outputting
permalink: /:categories/:title/

collections:
  pages:
    output: true
  projects:
    output: true
    permalink: /:collection/:path/

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Plugins (previously gems:)
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

